# `the`: the public, Linux/Nix-focused Thepia command line. A standalone workspace (no dependency on
# the private thepia/cli repo); see README.md for scope.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Thepia/the"
homepage = "https://thepia.com"

[workspace.dependencies]
# Terminal styling primitives; already in the tree through clap, so no new compiled crate.
anstyle = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SKILL.md frontmatter parser. Pure Rust, YAML 1.2, maintained (serde_yaml/serde_yml are deprecated).
# Same choice as thepia/cli's spec parser.
yaml-rust2 = "0.13"
# Unicode NFKC normalization for name-vs-directory matching (reference-validator parity). Pure Rust.
unicode-normalization = "0.1"

[profile.release]
lto = true
strip = true
