[package]
name = "thepia"
description = "Thepia command line for nurturing local AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "thepia"
path = "src/main.rs"

[[bin]]
name = "the"
path = "src/bin/the.rs"

[[bin]]
name = "th"
path = "src/bin/th.rs"

[dependencies]
the-output = { path = "../the-output", version = "0.4.0" }
the-skills = { path = "../the-skills", version = "0.4.0" }
the-agents = { path = "../the-agents", version = "0.4.0" }
the-use = { path = "../the-use", version = "0.4.0" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
yaml-rust2.workspace = true
